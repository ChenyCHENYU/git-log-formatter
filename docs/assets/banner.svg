<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="git-log-formatter banner">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171E3A"/>
      <stop offset="1" stop-color="#0A0F20"/>
    </linearGradient>
    <linearGradient id="b-accent" x1="70" y1="78" x2="192" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="b-glow-c" cx="230" cy="170" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b-glow-r" cx="1150" cy="40" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C084FC" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b-rim" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="b-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="30" fill="url(#b-bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="29" stroke="url(#b-rim)" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="338" rx="29" fill="url(#b-dots)"/>
  <circle cx="230" cy="170" r="230" fill="url(#b-glow-c)"/>
  <circle cx="1150" cy="40" r="420" fill="url(#b-glow-r)"/>

  <!-- Logo：日志行 -->
  <g transform="translate(86,86) scale(0.65625)">
    <g transform="translate(0,6)" fill="#05070F" fill-opacity="0.5">
      <circle cx="86" cy="94" r="8"/>
      <rect x="106" y="86" width="82" height="16" rx="8"/>
      <circle cx="86" cy="130" r="8"/>
      <rect x="106" y="122" width="58" height="16" rx="8"/>
      <circle cx="86" cy="166" r="8"/>
      <rect x="106" y="158" width="70" height="16" rx="8"/>
    </g>
    <g>
      <circle cx="86" cy="88" r="8" fill="url(#b-accent)"/>
      <rect x="106" y="80" width="82" height="16" rx="8" fill="url(#b-accent)"/>
      <circle cx="86" cy="124" r="8" fill="url(#b-accent)" opacity="0.55"/>
      <rect x="106" y="116" width="58" height="16" rx="8" fill="url(#b-accent)" opacity="0.55"/>
      <circle cx="86" cy="160" r="8" fill="url(#b-accent)" opacity="0.32"/>
      <rect x="106" y="152" width="70" height="16" rx="8" fill="url(#b-accent)" opacity="0.32"/>
    </g>
  </g>

  <text x="316" y="150" fill="#F4F6FB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="54" font-weight="700" letter-spacing="0.5">git-log-formatter</text>
  <text x="318" y="196" fill="#9AA3BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="21">彩色 git log · 自动分页 · 全局安装自动配置 git lg 别名</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5">
    <rect x="316" y="224" width="106" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="369" y="244.5" fill="#C7CDE0" text-anchor="middle">git lg 别名</text>
    <rect x="434" y="224" width="106" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="487" y="244.5" fill="#C7CDE0" text-anchor="middle">自动分页</text>
    <rect x="552" y="224" width="124" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="614" y="244.5" fill="#C7CDE0" text-anchor="middle">Zero Config</text>
  </g>

  <text x="1128" y="308" fill="#626A85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" text-anchor="end">by CHENY · github.com/ChenyCHENYU</text>
</svg>
